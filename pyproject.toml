[project]
name = "portbin"
version = "0.1.0"
description = "Portable development binary manager"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["cli", "packages", "manifest", "tools"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Environment :: Console",
]
dependencies = [
    "pydantic>=2.0",
    "truststore>=0.10",
]

[project.scripts]
portbin = "portbin.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "pyinstaller>=6.0",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"